name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous, now outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ruff check
        run: pipx run ruff check --output-format=github src/
      - name: ruff format
        run: pipx run ruff format --check src/

  build-and-test:
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # Only build and test dependencies; Gazebo/RViz are not needed to compile
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-opencv python3-numpy python3-pytest
          rosdep update --rosdistro lyrical
          rosdep install --from-paths src --ignore-src -y --rosdistro lyrical \
            --dependency-types build --dependency-types buildtool --dependency-types test

      - name: Build
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        run: |
          source install/setup.bash
          python3 -m pytest -v src/behavior/test